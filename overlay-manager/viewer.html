<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overlay</title>
<!-- Shared component styles load once here, NOT inside the injected overlay
     fragment — a <link> inside the fragment is re-fetched on every reload
     (no-store), flashing unstyled text. -->
<link rel="stylesheet" href="/components/common.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  #container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #overlay > [data-overlay-layer] {
    --layer-transition-duration: 180ms;
    transition: opacity var(--layer-transition-duration) ease-in-out;
  }
  #overlay > [data-overlay-layer].layer-hidden {
    opacity: 0;
  }
  #v, #snap {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

</style>
</head>
<body>
  <div id="container">
    <div id="overlay"></div>
    <video id="v" autoplay muted playsinline controls></video>
    <img id="snap" alt="">
  </div>
  
<script>
const params = new URLSearchParams(location.search);
const mode = params.get('mode');
const isPreview = mode === 'preview';
const isLive = mode === 'live';
const isOBS = mode === 'obs';
// `nofeed=1` hides the video on a preview/live pane. /manager sets it on its
// staging pane so only one WebRTC session (one decode) is ever held at a time.
const noFeed = params.get('nofeed') === '1';

// "preview" shows the staging overlay; "live" and "obs" both show the live
// one — "obs" just hides the video (Browser Source). No mode = same as obs.
const overlayFile = isPreview ? '/overlay-preview.html' : '/overlay-live.html';

function layerElements(root) {
  return new Map(
    [...root.querySelectorAll(':scope > [data-overlay-layer]')]
      .map((element) => [element.dataset.overlayLayer, element])
  );
}

function waitForFrame() {
  return new Promise((resolve) => requestAnimationFrame(resolve));
}

async function fadeOut(element) {
  element.classList.add('layer-hidden');
  await waitForTransition(element);
}

function waitForTransition(element) {
  const duration = parseFloat(getComputedStyle(element).transitionDuration) * 1000;
  return new Promise((resolve) => setTimeout(resolve, duration));
}

async function replaceLayer(current, next) {
  await fadeOut(current);
  next.classList.add('layer-hidden');
  current.replaceWith(next);
  await waitForFrame();
  // Force the hidden state to be committed before removing it. Without this
  // read, the browser can batch both style changes and skip the fade-in.
  next.getBoundingClientRect();
  next.classList.remove('layer-hidden');
}

async function updateLiveLayers(overlay, html) {
  const incoming = document.createElement('div');
  incoming.innerHTML = html;
  const currentLayers = layerElements(overlay);
  const incomingLayers = layerElements(incoming);
  const animations = [];

  for (const [id, current] of currentLayers) {
    if (!incomingLayers.has(id)) {
      animations.push(fadeOut(current).then(() => current.remove()));
    }
  }

  for (const [id, next] of incomingLayers) {
    const current = currentLayers.get(id);
    if (current && current.outerHTML === next.outerHTML) continue;

    if (current) {
      animations.push(replaceLayer(current, next));
    } else {
      next.classList.add('layer-hidden');
      overlay.appendChild(next);
      animations.push(waitForFrame().then(() => {
        next.getBoundingClientRect();
        next.classList.remove('layer-hidden');
      }));
    }
  }

  await Promise.all(animations);
}

async function loadOverlay() {
  const res = await fetch(overlayFile, { cache: 'no-store' });
  const overlay = document.getElementById('overlay');
  const html = await res.text();

  if (isLive && overlay.querySelector(':scope > [data-overlay-layer]')) {
    await updateLiveLayers(overlay, html);
  } else if (isLive) {
    overlay.innerHTML = html;
    for (const layer of overlay.querySelectorAll(':scope > [data-overlay-layer]')) {
      layer.classList.add('layer-hidden');
    }
    await waitForFrame();
    for (const layer of overlay.querySelectorAll(':scope > [data-overlay-layer]')) {
      layer.classList.remove('layer-hidden');
    }
  } else {
    overlay.innerHTML = html;
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/ws');
  ws.onmessage = (ev) => {
    if (ev.data === 'reload:all' || ev.data === `reload:${mode}`) loadOverlay();
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}

loadOverlay();
connect();
</script>

<!-- FEED: a ~1 fps JPEG snapshot (default) or a live WebRTC stream (?stream=1).
     The snapshot keeps the shared iGPU free for OBS — see server.js. -->
<script>

// Path comes from ?path=... and must exist in mediamtx.yml (test, cam, ...).
const path = params.get('path') || 'test';
const WHEP = `http://${location.hostname}:8889/${path}/whep`;

const video = document.getElementById('v');
const snap = document.getElementById('snap');
const status = document.getElementById('status');
const say = (msg, cls = '') => {
  if (!status) return;
  status.textContent = msg;
  status.className = cls;
};

// A pane shows the camera only in preview/live mode and without `nofeed=1`; the
// OBS Browser Source loads no mode, so it stays overlay-only. The snapshot is the
// default because it costs almost nothing; `?stream=1` opts into a WebRTC feed.
const wantFeed = (isPreview || isLive) && !noFeed;
const useWebrtc = wantFeed && params.get('stream') === '1';

let snapTimer = null;
function snapTick() { snap.src = `/cam.jpg?src=${encodeURIComponent(path)}&t=${Date.now()}`; }
function snapStart() {
  if (snapTimer) return;
  snap.style.display = 'block';
  snapTick();
  snapTimer = setInterval(snapTick, 1000);
}
function snapStop() {
  clearInterval(snapTimer);
  snapTimer = null;
  snap.removeAttribute('src');
}

if (wantFeed && !useWebrtc) {
  snapStart();
  // Don't keep grabbing frames for a pane nobody is looking at.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) snapStop();
    else snapStart();
  });
}

let pc, retry;

async function connectSDP() {
  clearTimeout(retry);
  if (pc) { pc.close(); pc = null; }

  pc = new RTCPeerConnection();
  // Video only — the test paths publish no audio track. Note that Firefox
  // offers just VP8/VP9 here, so mediamtx must publish VP8 (see mediamtx.yml).
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.ontrack = e => { video.srcObject = e.streams[0]; };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') say(`live · ${path} · webrtc`, 'ok');
    // ffmpeg is spawned on demand, so the first connect can lose a race; retry.
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      say('connection lost, retrying…', 'err');
      retry = setTimeout(connectSDP, 2000);
    }
  };

  await pc.setLocalDescription(await pc.createOffer());

  // MediaMTX accepts a non-trickle offer, so wait for ICE gathering to finish
  // rather than implementing the PATCH-based trickle flow.
  if (pc.iceGatheringState !== 'complete') {
    await new Promise(res => {
      const check = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', check);
          res();
        }
      };
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(res, 1500); // don't hang forever on a stuck candidate
    });
  }

  try {
    const res = await fetch(WHEP, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error(`WHEP ${res.status} ${res.statusText} — ${(await res.text()).trim()}`);
    await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
  } catch (err) {
    say(`${err.message}`, 'err');
    retry = setTimeout(connectSDP, 2000);
  }
}

if (useWebrtc) {
  video.style.display = 'block';
  connectSDP();
}
</script>


</body>
</html>

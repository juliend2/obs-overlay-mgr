<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overlay-manager</title>
<style>
  * { box-sizing: border-box; }

  body { font-family: sans-serif; margin: 2rem auto; }

  #editor { width: 100%; height: 320px; font-family: monospace; font-size: 14px; box-sizing: border-box; display: none; }

  button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 14px; }

  .status { margin-left: 1rem; color: #777; }
  .status.err { color: #b00; }

  h3 { margin: 1.25rem 0 0.25rem; }

  .wrap {
    width: 100%;
    display: flex;
    align-items: flex-start;
  }
  .left, .right {
    width: 40%;
  }
  .middle {
    width: 20%;
    padding: 0 1rem;
  }

  .col-third {
    width: 33.333%;
  }

  .form {
    padding: 0.75rem;
    margin: 0.5rem 0;
  }
  .form .field { display: block; margin-bottom: 0.75rem; }
  .form .field span { display: block; font-size: 12px; color: #555; margin-bottom: 0.25rem; }
  .form input[type="text"], .form textarea {
    width: 100%;
    font-family: monospace;
    font-size: 13px;
    padding: 0.25rem;
  }
  .form textarea { display: block; height: 110px; resize: vertical; }
  .form .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .form .actions button { margin-top: 0; }

  #presets { list-style: none; padding: 0; margin: 0.5rem 0 0; }
  #presets li { display: flex; gap: 0.4rem; align-items: center; margin: 0.25rem 0; }
  #presets button { margin-top: 0; font-size: 12px; padding: 0.25rem 0.5rem; }
  #presets .use { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="left">
      <iframe src="http://localhost:8081/?mode=preview" style="width: 100%; height: 400px"></iframe>
      <div>
      </div>
    </div>
    <div class="middle">
      <div>
        <button id="golive">Go live</button><span id="golive-status" class="status"></span>
      </div>
    </div>
    <div class="right">
      <iframe src="http://localhost:8081/?mode=live" style="width: 100%; height: 400px"></iframe>
    </div>
  </div>

  <div class="wrap">
    <div class="col-third">
      <h3>Templates</h3>
      <div id="components"></div>
      <textarea id="editor" spellcheck="false"></textarea><br>
      <!--<button id="test">Test</button><span id="test-status" class="status"></span>-->
    </div>
    <div class="col-third">
      <div id="form-container">
        <h3>Creation de Preset</h3>
      </div>
    </div>
    <div class="col-third">
      <h3>Presets</h3>
      <ul id="presets"></ul>
    </div>
  </div>

<script src="/manager.js"></script>
</body>
</html>

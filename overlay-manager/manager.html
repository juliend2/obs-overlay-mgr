<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overlay-manager</title>
<!-- Template previews in the creation form need the shared component styles;
     the fragments themselves must not carry the <link> (see viewer.html). -->
<link rel="stylesheet" href="/components/common.css">
<style>
  :root {
    --search-box-height: 2rem;
    --label-color: #ddd;
  }
  /* general stuff */
  * { box-sizing: border-box; }

  body {
    font-family: sans-serif; margin: 0px auto; padding: 4px;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: min-content minmax(0, 1fr);
    gap: 0px 0px;
    grid-auto-flow: row;
    overflow: hidden;
    grid-template-areas:
      "."
      ".";
    background: #1b1b1b;
    color: white;
  }

  #html-editor { width: 100%; height: 320px; font-family: monospace; font-size: 14px; box-sizing: border-box; display: none; }

  button { margin-top: 0rem; padding: 0.25rem .4rem; font-size: 12px; }

  .status { margin-left: 1rem; color: #777; }
  .status.err { color: #b00; }

  h3 { margin: 1.25rem 0 0.25rem; }

  /* layout */
  .wrap {
    width: 100%;
    display: flex;
    align-items: stretch;
    min-height: 0;
  }
  .left, .right {
    width: 40%;
  }
  .middle {
    width: 20%;
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .col-third {
    width: 33.333%;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: min-content minmax(var(--search-box-height), 1fr);
    gap: 0px 0px;
    grid-auto-flow: row;
    grid-template-areas:
      "."
      ".";
  }

  /* Keep the search controls at the top instead of stretching the input row. */
  .col-third:has(#preset-search) {
    grid-template-rows: min-content minmax(var(--search-box-height), 1fr);
  }

  /* forms */
  .form {
    padding: 0.75rem;
    margin: 0.5rem 0;
  }
  .form .field { display: block; margin-bottom: 0.75rem; }
  .form .field span { display: block; font-size: 12px; color: var(--label-color); margin-bottom: 0.25rem; }
  .form input[type="text"], .form textarea {
    width: 100%;
    font-family: monospace;
    font-size: 13px;
    padding: 0.25rem;
  }
  .form textarea { display: block; height: 110px; resize: vertical; }
  .form .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .form .actions button { margin-top: 0; }

  #components,
  #form-container,
  #presets { overflow-y: scroll; overflow-x: hidden; }

  /* Dark-mode friendly scrollbars for the manager's scrollable panels. */
  #components,
  #form-container,
  #presets {
    scrollbar-color: #777 #252525;
    scrollbar-width: thin;
  }
  #components::-webkit-scrollbar,
  #form-container::-webkit-scrollbar,
  #presets::-webkit-scrollbar {
    width: 9px;
  }
  #components::-webkit-scrollbar-track,
  #form-container::-webkit-scrollbar-track,
  #presets::-webkit-scrollbar-track {
    background: #252525;
  }
  #components::-webkit-scrollbar-thumb,
  #form-container::-webkit-scrollbar-thumb,
  #presets::-webkit-scrollbar-thumb {
    background: #777;
    border-radius: 5px;
    border: 2px solid #252525;
  }
  #components::-webkit-scrollbar-thumb:hover,
  #form-container::-webkit-scrollbar-thumb:hover,
  #presets::-webkit-scrollbar-thumb:hover {
    background: #888;
  }

  /* presets */
  #presets { margin: 0.5rem 0 0; }
  #presets details { margin: 0.25rem 0; }
  #presets summary {
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    color: var(--label-color);
  }
  #presets ul { list-style: none; padding: 0; margin: 0.25rem 0 0 0.75rem; }
  #presets li { display: flex; gap: 0.4rem; align-items: center; margin: 2px 0; }
  #presets li a { background: magenta; color: white; padding-left: .2vw; }
  #presets li a:hover { background: white; color: magenta; text-decoration: none; }
  #presets li a.selected { background: white; color: black; }
  #presets .use { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  #presets li input.rename { flex: 1; min-width: 0; font-size: 12px; padding: 0.1rem 0.2rem; }
  #presets .delete-btn { font-size: .9rem; padding: 0; border: none; }
    .delete-btn:hover { background: black; color: white; }

  /* fuzzy search */
  #preset-search {
    width: 100%;
    height: var(--search-box-height);
    margin: 0 0 0.25rem;
    padding: 0.25rem;
    font-size: 13px;
  }
  #presets .no-match { margin: 0.5rem 0.75rem; font-size: 13px; color: #777; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="left">
      <iframe class="overlay-frame" src="http://localhost:8081/?mode=preview" style="width: 100%"></iframe>
      <div>
      </div>
    </div>
    <div class="middle">
      <div>
        <button id="golive">Go live →</button><span id="golive-status" class="status"></span>
      </div>
    </div>
    <div class="right">
      <iframe class="overlay-frame" src="http://localhost:8081/?mode=live" style="width: 100%"></iframe>
    </div>
  </div>

  <div class="wrap">
    <div class="col-third">
      <h3>Templates</h3>
      <div id="components"></div>
      <textarea id="html-editor" spellcheck="false"></textarea>
    </div>
    <div class="col-third">
      <h3>Creation de Preset</h3>
      <div id="form-container"></div>
    </div>
    <div class="col-third">
      <h3>Presets</h3>
      <input id="preset-search" type="text" placeholder="Rechercher dans les presets…" autocomplete="off">
      <div id="presets"></div>
    </div>
  </div>

<script src="/manager.js"></script>
</body>
</html>

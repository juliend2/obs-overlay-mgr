# Minimal MediaMTX config for a local test feed.
# Only RTSP (ingest) + WebRTC (playback) are on; everything else is off to keep
# the footprint small.

logLevel: info

api: false
metrics: false
pprof: false
playback: false
rtmp: false
srt: false
hls: false
moq: false

# ffmpeg publishes here
rtsp: true
rtspAddress: :8554
# UDP is kept enabled so RTSP readers (OBS's Media Source) connect without a
# "461 Unsupported Transport" round-trip. The default RTP ports are :8000/:8001,
# which collide numerically with the PHP dev server, so move them out of the way.
rtspTransports: [udp, tcp]
rtpAddress: :8100
rtcpAddress: :8101

# browser plays from here (WHEP)
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

paths:
  # Codec choice is forced by the browser: Firefox offers only VP8/VP9 in its
  # WebRTC SDP (verified: no H.264 payload type in the offer, even with the
  # OpenH264 2.6.0 GMP installed). So VP8 at 854x480@25 by default — software
  # VP8 encoding is the costliest step here and it scales steeply with
  # resolution, so this is a conservative default. Raise it if yours keeps up.
  # runOnDemand means ffmpeg only runs while a viewer is connected.

  test:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=854x480:rate=25
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 1M -g 25
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # smoother motion, lower resolution — the cheapest path to encode
  smooth:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=640x360:rate=30
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 800k -g 30
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  mandelbrot:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i mandelbrot=size=854x480:rate=25
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 1M -g 25
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # H.264 720p. Firefox will reject this over WebRTC, but it is the path to use
  # for OBS's Media Source (which is ffmpeg-based and decodes H.264 natively),
  # and it plays in Chromium. Cheaper to encode than VP8 at the same size.
  # In OBS, Network Buffering must be 0 MB or the source renders black.
  h264:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=1280x720:rate=30
      -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline
      -pix_fmt yuv420p -g 30
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # HDMI capture card (a UVC stick plugged into the machine shows up as
  # /dev/video0; check with `v4l2-ctl --list-devices`, use the even-numbered
  # device). One ffmpeg = the card's single allowed reader; it publishes two
  # paths at once so OBS and the browser can watch simultaneously:
  #   cam     → H.264 720p   → OBS Media Source (decodes H.264 natively)
  #   cam-vp8 → VP8  720p    → webrtc.html in Firefox (rejects H.264, see above)
  # OBS: Input rtsp://127.0.0.1:8554/cam, Network Buffering 0, rtsp_transport=tcp.
  # Browser: http://127.0.0.1:8000/webrtc.html?path=cam-vp8
  # No `-re` here: a capture device paces itself, unlike the lavfi test sources.
  # runOnDemand hangs off `cam`, so the feed starts when OBS activates its
  # source (or a Chromium viewer requests ?path=cam); a Firefox viewer on
  # cam-vp8 just retries until the encoder is up.
  cam:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -f v4l2 -framerate 30 -video_size 1280x720 -i /dev/video0
      -map 0:v -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline
      -pix_fmt yuv420p -g 30
      -f rtsp rtsp://127.0.0.1:8554/cam
      -map 0:v -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 2M -g 30
      -f rtsp rtsp://127.0.0.1:8554/cam-vp8
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # sink for the VP8 half of `cam` — no runOnDemand (that would spawn a second
  # ffmpeg fighting for the card); it just receives cam's second output.
  cam-vp8:

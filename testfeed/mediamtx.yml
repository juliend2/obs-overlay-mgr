# Minimal MediaMTX config for a local test feed.
# Only RTSP (ingest) + WebRTC (playback) are on; everything else is off to keep
# the footprint small.

logLevel: info

api: false
metrics: false
pprof: false
playback: false
rtmp: false
srt: false
hls: false
moq: false

# ffmpeg publishes here
rtsp: true
rtspAddress: :8554
# UDP is kept enabled so RTSP readers (OBS's Media Source) connect without a
# "461 Unsupported Transport" round-trip. The default RTP ports are :8000/:8001,
# which collide numerically with the PHP dev server, so move them out of the way.
rtspTransports: [udp, tcp]
rtpAddress: :8100
rtcpAddress: :8101

# browser plays from here (WHEP)
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

paths:
  # Codec choice is forced by the browser: Firefox offers only VP8/VP9 in its
  # WebRTC SDP (verified: no H.264 payload type in the offer, even with the
  # OpenH264 2.6.0 GMP installed). So VP8 at 854x480@25 by default — software
  # VP8 encoding is the costliest step here and it scales steeply with
  # resolution, so this is a conservative default. Raise it if yours keeps up.
  # runOnDemand means ffmpeg only runs while a viewer is connected.

  test:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=854x480:rate=25
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 1M -g 25
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # smoother motion, lower resolution — the cheapest path to encode
  smooth:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=640x360:rate=30
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 800k -g 30
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  mandelbrot:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i mandelbrot=size=854x480:rate=25
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 1M -g 25
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # H.264 720p. Firefox will reject this over WebRTC, but it is the path to use
  # for OBS's Media Source (which is ffmpeg-based and decodes H.264 natively),
  # and it plays in Chromium. Cheaper to encode than VP8 at the same size.
  # In OBS, Network Buffering must be 0 MB or the source renders black.
  h264:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -re -f lavfi -i testsrc=size=1280x720:rate=30
      -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline
      -pix_fmt yuv420p -g 30
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # HDMI capture card (a UVC stick plugged into the machine shows up as a
  # /dev/videoN; check with `v4l2-ctl --list-devices`, use the even-numbered
  # device — the Elgato Cam Link 4K here is /dev/video0, or the stable alias
  # /dev/v4l/by-id/usb-Elgato_Cam_Link_4K_*-video-index0). It must be on a
  # USB 3.0 port: on USB 2.0 (480 Mbps) it still enumerates but never delivers
  # frames. The card exposes the HDMI input's native resolution rather than a
  # menu of sizes, so capture as-is and scale to 720p. Only `cam` reads the
  # card; `cam-vp8` is derived from it (see below), so OBS and the browser can
  # watch simultaneously:
  #   cam     → H.264 720p   → OBS Media Source (decodes H.264 natively)
  #   cam-vp8 → VP8  720p    → webrtc.html / /manager in Firefox (rejects H.264)
  # The manager page previews the card by default (path `cam` in Chromium,
  # `cam-vp8` in Firefox); /manager?path=test restores the synthetic pattern.
  # OBS: Input rtsp://127.0.0.1:8554/cam, Network Buffering 0, rtsp_transport=tcp.
  # Browser: http://127.0.0.1:8000/webrtc.html?path=cam-vp8
  # No `-re` here: a capture device paces itself, unlike the lavfi test sources.
  # -rtsp_transport tcp on the output: ffmpeg's RTSP muxer defaults to UDP,
  # which drops packets on loopback under this encode load (→ "RTP packets
  # lost" + "invalid FU-A packet" errors in mediamtx).
  # Only one process may read the card, so OBS must take the feed as a Media
  # Source above — NOT as a Video Capture Device (V4L2) source, which holds
  # /dev/video0 exclusively and makes this on-demand encoder fail with
  # "Device or resource busy" (leaving /manager with no video).
  # Encoding runs on the Intel iGPU via VAAPI (Haswell HD 4400, i965 driver)
  # instead of the CPU: this box is a 2-core i3 and OBS's own encoder needs the
  # CPU while streaming. Measured ~0.19 core saved vs libx264 ultrafast 720p30.
  # iHD_drv_video.so init fails harmlessly; ffmpeg falls back to i965.
  # To revert to software, swap the -vaapi_device / -vf / -c:v lines for:
  #   -vf scale=-2:720 -c:v libx264 -preset ultrafast -tune zerolatency
  #   -profile:v baseline -pix_fmt yuv420p -g 30
  cam:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -vaapi_device /dev/dri/renderD128
      -f v4l2 -framerate 30 -i /dev/video0
      -vf scale=-2:720,format=nv12,hwupload
      -c:v h264_vaapi -profile:v constrained_baseline -coder cavlc
      -rc_mode CQP -qp 22 -bf 0 -g 30
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s

  # VP8 copy of `cam`, produced on demand for Firefox's WebRTC player (it
  # rejects H.264, see above). This does NOT read the card — it transcodes from
  # `cam`, and connecting to `cam` starts cam's encoder through ITS runOnDemand.
  # So a Firefox viewer that asks for cam-vp8 alone (e.g. /manager with no OBS
  # running) still brings up the whole chain, with a single card reader.
  cam-vp8:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel error
      -rtsp_transport tcp -i rtsp://127.0.0.1:8554/cam
      -c:v libvpx -deadline realtime -cpu-used 16 -threads 2 -b:v 2M -g 30
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam-vp8
    runOnDemandRestart: true
    runOnDemandCloseAfter: 10s
